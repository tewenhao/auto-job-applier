[project]
name = "auto-job-applier"
version = "0.1.0"
description = "AI-powered agentic pipeline for summer internship mass applications — backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "supabase>=2.6",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[project.scripts]
ajp = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
